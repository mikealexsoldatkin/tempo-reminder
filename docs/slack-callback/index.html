<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting Slack…</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: #f7f8f9; color: #172b4d; }
  main { max-width: 30rem; padding: 2rem; background: #fff; border-radius: 6px;
         box-shadow: 0 1px 3px rgba(9, 30, 66, .25); }
  h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
  p { margin: 0; line-height: 1.6; color: #44546f; }
</style>
</head>
<body>
<main>
  <h1 id="title">Connecting Slack…</h1>
  <p id="text">One moment — sending the authorization back to Jira.</p>
</main>
<script>
/*
 * Единственное назначение этой страницы — переслать ответ Slack на веб-триггер
 * той установки приложения, из которой начали подключение.
 *
 * Зачем она вообще нужна: Slack принимает только заранее зарегистрированные
 * redirect_uri, а адрес веб-триггера Forge свой у каждой установки — вписать их
 * все в настройки Slack-приложения нельзя. Поэтому Slack всегда возвращает
 * браузер сюда, а куда идти дальше, приезжает в state.
 *
 * Страница статическая: ничего не хранит, никуда не ходит и ничего не знает про
 * client_secret — код на токен меняет уже само приложение. Всё, что здесь есть,
 * это проверка адреса и переход.
 *
 * Публикуется как есть (GitHub Pages / Cloudflare Pages / любой статический
 * хостинг), а её адрес прописывается двум сторонам:
 *   - Slack: Basic Information → OAuth & Permissions → Redirect URLs;
 *   - Forge: forge variables set SLACK_REDIRECT_URI <этот адрес>.
 */

// Куда разрешено переходить. Без этой проверки страница стала бы открытым
// редиректором: state приходит из браузера и доверять ему нельзя.
var ALLOWED_HOST_SUFFIXES = ['.webtrigger.atlassian.app', '.atlassian-dev.net'];

function show(title, text) {
  document.getElementById('title').textContent = title;
  document.getElementById('text').textContent = text;
}

function decodeState(raw) {
  var padded = raw.replace(/-/g, '+').replace(/_/g, '/');
  while (padded.length % 4 !== 0) padded += '=';
  // В state только адрес и uuid — не-ASCII там взяться неоткуда.
  var parsed = JSON.parse(atob(padded));
  var url = new URL(parsed.cb);
  var allowed = ALLOWED_HOST_SUFFIXES.some(function (suffix) {
    return url.hostname.endsWith(suffix);
  });
  if (url.protocol !== 'https:' || !allowed) throw new Error('unexpected callback host');
  return url;
}

(function () {
  var params = new URLSearchParams(window.location.search);
  var state = params.get('state');
  var code = params.get('code');
  var error = params.get('error');

  if (!state) {
    show('Slack was not connected', 'This page opens only as part of connecting Slack. Start from the Tempo Reminders settings in Jira.');
    return;
  }

  var target;
  try {
    target = decodeState(state);
  } catch (e) {
    show('Slack was not connected', 'The link is malformed — start again from the Tempo Reminders settings in Jira.');
    return;
  }

  // Отказ на экране согласия пересылаем тоже: приложение должно погасить у себя
  // начатое подключение, а не ждать его десять минут.
  if (error) target.searchParams.set('error', error);
  else if (code) target.searchParams.set('code', code);
  else {
    show('Slack was not connected', 'Slack returned no authorization code — start again from the Tempo Reminders settings in Jira.');
    return;
  }
  target.searchParams.set('state', state);

  // replace, а не assign: «назад» не должен возвращать на страницу с уже
  // использованным кодом.
  window.location.replace(target.toString());
})();
</script>
</body>
</html>
