app:
  id: ari:cloud:ecosystem::app/9c422f50-9981-4070-893f-c89e6ea3dfff
  runtime:
    name: nodejs24.x
modules:
  jira:adminPage:
    - key: tempo-reminder-admin
      resource: admin-page
      render: native
      resolver:
        function: resolver
      title: Tempo Reminders
  scheduledTrigger:
    - key: tempo-reminder-hourly
      function: scheduled
      interval: hour  # options: fiveMinute | hour | day | week
  consumer:
    - key: tempo-reminder-run-consumer
      queue: reminder-run
      function: run-consumer
  webtrigger:
    - key: slack-oauth-callback
      function: slack-oauth
      urlFormat: v2
      response:
        type: dynamic
    - key: tempo-oauth-callback
      function: tempo-oauth
      urlFormat: v2
      response:
        type: dynamic
  function:
    - key: resolver
      handler: index.resolver
    - key: scheduled
      handler: index.scheduled
    - key: run-consumer
      handler: index.runConsumer
    - key: slack-oauth
      handler: index.slackOAuthCallback
    - key: tempo-oauth
      handler: index.tempoOAuthCallback
resources:
  - key: admin-page
    path: src/frontend/admin.jsx
permissions:
  scopes:
    - read:jira-user
    - read:jira-work
    - storage:app
    - read:email-address:jira
  external:
    fetch:
      backend:
        - address: 'api.tempo.io'
        - address: 'slack.com'
        - address: 'calendar.google.com'
