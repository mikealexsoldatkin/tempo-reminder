app:
  id: ari:cloud:ecosystem::app/c8529d15-644e-4dbd-8c0a-987b9996e6d9
  runtime:
    name: nodejs24.x
modules:
  jira:adminPage:
    - key: tempo-reminder-admin
      resource: admin-page
      render: native
      resolver:
        function: resolver
      title: Tempo Reminders
  scheduledTrigger:
    # Час — самая мелкая практичная гранулярность триггера. Конкретные времена
    # рассылки задаются в настройках приложения (settings.runTimes), а функция
    # на каждом срабатывании сверяется с ними; см. evaluateSchedule в reminder.js.
    - key: tempo-reminder-hourly
      function: scheduled
      interval: hour  # options: fiveMinute | hour | day | week
  consumer:
    - key: tempo-reminder-run-consumer
      queue: reminder-run
      function: run-consumer
  function:
    - key: resolver
      handler: index.resolver
    - key: scheduled
      handler: index.scheduled
    - key: run-consumer
      handler: index.runConsumer
resources:
  - key: admin-page
    path: src/frontend/admin.jsx
permissions:
  scopes:
    - read:jira-user
    - read:jira-work
    - storage:app
    # Email API: приложению видны только профильные поля с видимостью «Anyone»,
    # а email обычно ограничен организацией. Без этого scope адреса не прочитать.
    - read:email-address:jira
  external:
    fetch:
      backend:
        - address: 'api.tempo.io'
        - address: 'slack.com'
