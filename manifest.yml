app:
  id: ari:cloud:ecosystem::app/c8529d15-644e-4dbd-8c0a-987b9996e6d9
  runtime:
    name: nodejs24.x
modules:
  jira:adminPage:
    - key: tempo-reminder-admin
      resource: admin-page
      render: native
      resolver:
        function: resolver
      title: Tempo Reminders
  scheduledTrigger:
    - key: tempo-reminder-hourly
      function: scheduled
      interval: hour  # options: fiveMinute | hour | day | week
  consumer:
    - key: tempo-reminder-run-consumer
      queue: reminder-run
      function: run-consumer
  # Возврат из Slack при подключении по OAuth. Slack требует заранее
  # зарегистрированный redirect_uri, а этот адрес свой у каждой установки,
  # поэтому браузер приходит сюда не напрямую, а со статической страницы —
  # см. src/backend/slackOAuth.js и docs/slack-callback/index.html.
  # Ответ dynamic: на странице «готово» называется подключённый workspace.
  # Возврат из Tempo при подключении по OAuth. Здесь, в отличие от Slack,
  # промежуточной страницы нет: Tempo возвращает на redirect_uri только `code`,
  # без `state`, — переслать его дальше такой странице было бы некуда. Поэтому
  # адрес этого веб-триггера вписывается прямо в OAuth-приложение Tempo при
  # развёртывании (см. src/backend/tempoOAuth.js и README).
  webtrigger:
    - key: slack-oauth-callback
      # Ключ функции отличается от ключа вебтриггера: ключи модулей уникальны на
      # весь манифест, а «slack-oauth-callback» занят самим вебтриггером — именно
      # его спрашивает webTrigger.getUrl() в src/backend/slackOAuth.js.
      function: slack-oauth
      urlFormat: v2
      response:
        type: dynamic
    - key: tempo-oauth-callback
      function: tempo-oauth
      urlFormat: v2
      response:
        type: dynamic
  function:
    - key: resolver
      handler: index.resolver
    - key: scheduled
      handler: index.scheduled
    - key: run-consumer
      handler: index.runConsumer
    - key: slack-oauth
      handler: index.slackOAuthCallback
    - key: tempo-oauth
      handler: index.tempoOAuthCallback
resources:
  - key: admin-page
    path: src/frontend/admin.jsx
permissions:
  scopes:
    - read:jira-user
    - read:jira-work
    - storage:app
    - read:email-address:jira
  external:
    fetch:
      backend:
        - address: 'api.tempo.io'
        - address: 'slack.com'
        # Календарь отпусков читается по «Secret address in iCal format».
        - address: 'calendar.google.com'
